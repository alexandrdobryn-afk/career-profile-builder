services:
  app:
    build: .
    ports:
      - "3012:3000"
    volumes:
      - ./data:/app/data          # SQLite database
      - ./uploads:/app/uploads    # User files
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env before starting the app}
    restart: unless-stopped
